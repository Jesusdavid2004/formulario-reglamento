services:
  - type: web
    name: formulario-reglamento
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: QR_ACCESS_TOKEN
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: PERSIST_DIR
        value: /var/data
    disk:
      name: reglamentos-data
      mountPath: /var/data
      sizeGB: 1